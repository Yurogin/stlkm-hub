[workspace]
resolver = "2"
members = ["crates/stlkm-core", "crates/stlkm-cli", "crates/stlkm-gui"]

[workspace.package]
version = "1.0.3"
edition = "2021"
authors = ["STLKM"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
directories = "5"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zip = "2"
flate2 = "1"
tar = "0.4"
tauri-plugin-updater = "2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
stlkm-core = { path = "crates/stlkm-core" }
